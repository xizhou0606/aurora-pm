server {
  listen 80;
  server_name _;
  client_max_body_size 220m;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "frame-ancestors __PM_FRAME_ANCESTORS__" always;

  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "frame-ancestors __PM_FRAME_ANCESTORS__" always;
    try_files $uri =404;
  }

  # Content-hashed build artifacts: the filename changes with every release,
  # so a cached hit can never go stale.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "frame-ancestors __PM_FRAME_ANCESTORS__" always;
    try_files $uri =404;
  }

  # index.html is the release pointer: revalidate on every load so a deploy
  # reaches new sessions immediately instead of when heuristic caching
  # expires. try_files' internal redirect lands here for SPA route URLs too.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "frame-ancestors __PM_FRAME_ANCESTORS__" always;
    try_files $uri =404;
  }

  # 版本公告 feed:pm-api 根路径提供服务;/release-notes 是页面路由必须
  # 继续命中 SPA,所以 API 路径用精确匹配显式重写。
  location = /api/release-notes {
    proxy_pass http://pm-api:8081/release-notes;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 多维表格走 SSE，不走 /collaboration WebSocket。两层代理都不能缓冲事件。
  location ~ ^/api/v1/platform/document-resources/[^/]+/collaboration/events$ {
    proxy_pass http://pm-api:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # nginx 默认消费该响应头；继续传给宿主机或其它上游代理。
    proxy_pass_header X-Accel-Buffering;
  }

  location /api/ {
    proxy_pass http://pm-api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # CLI and MCP clients discover OAuth at the public origin. Without this
  # proxy, try_files serves index.html and `pm setup` cannot authorize.
  location /.well-known/ {
    proxy_pass http://pm-api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://pm-api:8081;
    proxy_set_header Host $host;
  }

  # 协作 WebSocket：转发到 collaboration profile 的 pm-collaboration 容器。
  # proxy_pass 使用变量 + resolver 延迟解析 Docker DNS——协作服务未部署时
  # nginx 启动不会因为解析不到 pm-collaboration 而失败，仅该路径 502。
  location /collaboration {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $collab_upstream pm-collaboration:1234;
    proxy_pass http://$collab_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "frame-ancestors __PM_FRAME_ANCESTORS__" always;
    try_files $uri $uri/ /index.html;
  }
}
